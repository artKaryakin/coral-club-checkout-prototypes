<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-hidden="true">
  <!--
    Банковский перевод. Нейтральный значок вместо логотипа ЮKassa: на
    европейских рынках способ называется просто переводом, и чужой бренд
    рядом с ним называет компанию, которой в оплате нет.

    Форма повторяет остальные значки списка — круглая подложка 96×96 и
    штриховой глиф по центру. Глиф тот же, что у иконки «bank» в наборе
    дизайн-системы, чтобы он не выглядел чужим среди фирменных логотипов.
  -->
  <circle cx="48" cy="48" r="48" fill="#EEF2F3" />
  <g
    transform="translate(24 24) scale(2)"
    fill="none"
    stroke="#5F7374"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M3 10.5 12 5l9 5.5" />
    <line x1="3" y1="10.5" x2="21" y2="10.5" />
    <line x1="5" y1="10.5" x2="5" y2="18.5" />
    <line x1="10" y1="10.5" x2="10" y2="18.5" />
    <line x1="14" y1="10.5" x2="14" y2="18.5" />
    <line x1="19" y1="10.5" x2="19" y2="18.5" />
    <line x1="3" y1="18.5" x2="21" y2="18.5" />
  </g>
</svg>
